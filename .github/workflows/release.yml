name: Release

# Push a tag like v0.2.0 (tools/release.py does this) to build and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Tag matches package version
        run: |
          v=$(python -c "import train_tracker; print(train_tracker.__version__)")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version v$v"; exit 1; }

      - run: pytest -q
      - run: python -m build
      - name: Mac and Windows downloads
        run: python tools/make_downloads.py

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG entry for $GITHUB_REF_NAME"; exit 1; }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            printf '## Download\n\n'
            printf -- '- **Mac:** [US-Train-Tracker-for-Mac.zip](https://github.com/%s/releases/download/%s/US-Train-Tracker-for-Mac.zip): open it and double-click **Install Train Tracker.command**\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            printf -- '- **Windows:** [US-Train-Tracker-for-Windows.zip](https://github.com/%s/releases/download/%s/US-Train-Tracker-for-Windows.zip): extract it and double-click **Install Train Tracker.bat**\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            printf -- '- **Raspberry Pi / Linux:** the `.whl` file below (see the guide)\n\n'
            printf 'Both need Python 3.10 or newer from python.org. Step-by-step: the [Installation Guide](https://github.com/%s/blob/%s/docs/INSTALL.md), also attached as a PDF.\n\n## Changes\n\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            cat notes.md
          } > full-notes.md && mv full-notes.md notes.md
          gh release create "$GITHUB_REF_NAME" dist/* docs/US-Train-Tracker-Install-Guide.pdf \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
