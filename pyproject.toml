[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "train-tracker"
dynamic = ["version"]
description = "Live US passenger-train map: Amtrak and commuter rail over FRA NARN track"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Project Moon Pi" }]
dependencies = [
    "aiohttp>=3.9",
    "gtfs-realtime-bindings>=1.0",
    "protobuf>=4.21",
    "certifi>=2024.2.2",
    "tzdata; platform_system == 'Windows'",   # time zones for working out lateness (macOS and Linux have them)
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
train-tracker = "train_tracker.app:main"

[tool.setuptools.dynamic]
version = { attr = "train_tracker.__version__" }

[tool.setuptools.package-data]
train_tracker = ["feeds.json", "web/*", "web/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:It is recommended to use web.AppKey"]
